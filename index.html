<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>VPK Market Intelligence</title>
  <link rel="stylesheet" href="assets/app.css?v=21">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><span class="brand-mark">V</span><div><strong>VPK</strong><small>Market Intelligence</small></div></div>
      <nav id="nav">
        <button class="nav-item active" data-view="overview"><span>⌁</span>Market Overview</button>
        <button class="nav-item" data-view="sectors"><span>◫</span>Sector Rotation</button>
        <button class="nav-item" data-view="opportunities"><span>✦</span>Opportunities</button>
        <button class="nav-item" data-view="360"><span>◎</span>Ticker 360°</button>
        <button class="nav-item" data-view="dma200"><span>〽</span>200 DMA</button>
        <button class="nav-item" data-view="scanners"><span>▦</span>All Scanners</button>
        <button class="nav-item" data-view="compare"><span>⇄</span>Scanner Compare</button>
        <button class="nav-item" data-view="history"><span>◷</span>Time Machine</button>
        <button class="nav-item" data-view="research"><span>☆</span>My Research</button>
        <button class="nav-item" data-view="health"><span>✓</span>Data Health</button>
        <button class="nav-item" data-view="methodology"><span>ⓘ</span>Methodology</button>
      </nav>
      <div class="sidebar-foot"><span class="privacy-dot"></span>Personal research stays local</div>
    </aside>

    <main id="workspace">
      <header class="topbar">
        <button id="menu-toggle" class="icon-button mobile-only" aria-label="Toggle navigation">☰</button>
        <div class="page-title"><h1 id="page-title">Market Overview</h1><p id="page-subtitle">Health, breadth, rotation, and today's research map.</p></div>
        <div class="global-search"><label><span>⌕</span><input id="search" type="search" placeholder="Search any US ticker or company · /" autocomplete="off"></label><div id="search-results" class="search-results hidden"></div></div>
        <button id="theme-toggle" class="icon-button" aria-label="Toggle theme">◐</button>
      </header>

      <section id="health-strip" class="health-strip" aria-live="polite"></section>
      <section id="summary" class="summary-grid"></section>

      <section id="toolbar" class="toolbar">
        <div class="preset-row" id="presets"></div>
        <div class="toolbar-actions">
          <label>Scanner <select id="scanner-filter"><option value="">All scanners</option></select></label>
          <label>Sector <select id="sector-filter"><option value="">All sectors</option></select></label>
          <label>Industry <select id="industry-filter"><option value="">All industries</option></select></label>
          <label>Source <select id="source-filter"><option value="">All sources</option><option>BOTH</option><option>TRADINGVIEW</option><option>FINVIZ</option></select></label>
          <label>Opportunity <select id="opportunity-filter"><option value="">All opportunities</option></select></label>
          <label>RS <select id="rs-filter"><option value="">Any RS</option><option value="70">70+</option><option value="80">80+</option><option value="90">90+</option></select></label>
          <label>Trend <select id="trend-filter"><option value="">Any trend</option><option value="above65">Above 65 DMA</option><option value="near65">Near 65 DMA ±3%</option><option value="above200">Above 200 DMA</option><option value="near200">Near 200 DMA ±3%</option></select></label>
          <label>52W Range <select id="range-filter"><option value="">Any position</option><option value="top20">Top 20%</option><option value="middle">Middle 60%</option><option value="bottom20">Bottom 20%</option></select></label>
          <label>Sort <select id="sort"><option value="default">Review order</option><option value="ticker">Ticker A–Z</option><option value="categories">Category count</option><option value="scanners">Scanner count</option></select></label>
          <button id="copy-filtered" class="button secondary">Copy filtered</button>
          <button id="download-filtered" class="button secondary">Download TXT</button>
        </div>
      </section>

      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <div id="selection-bar" class="selection-bar hidden">
    <strong><span id="selection-count">0</span> selected</strong>
    <button data-selection="watchlist">Add to watchlist</button>
    <button data-selection="compare">Compare</button>
    <button data-selection="copy">Copy to TradingView</button>
    <button data-selection="download">Download TXT</button>
    <button data-selection="clear">Clear</button>
  </div>

  <aside id="ticker-drawer" class="drawer" aria-hidden="true" aria-label="Ticker quick view">
    <button id="drawer-close" class="drawer-close" aria-label="Close">×</button>
    <div id="drawer-content"></div>
  </aside>
  <div id="drawer-backdrop" class="backdrop hidden"></div>

  <dialog id="modal"><form method="dialog" id="modal-form"><div id="modal-content"></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="ticker-preview" class="ticker-preview hidden" aria-live="polite"></div>
  <script src="assets/app.js?v=21" defer></script>
</body>
</html>
